<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1129 1129" role="img" aria-labelledby="title desc">
<title id="title">Ultimate Pinball Arcade</title>
<desc id="desc">A glowing red and white neon sign spelling Ultimate Pinball Arcade.</desc>
<defs>
  <filter id="neon" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="38" result="wide"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="tight"/>
    <feMerge><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/></filter>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/><stop offset=".53" stop-color="#fff" stop-opacity=".95"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="letterMask"><rect width="1129" height="1129" fill="#000"/><g fill="#fff" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic"><text x="564" y="383" font-size="139" letter-spacing="5">ULTIMATE</text><text x="564" y="566" font-size="171" letter-spacing="2">PINBALL</text><text x="564" y="749" font-size="147" letter-spacing="5">ARCADE</text></g></mask>
  <style>
    .sign{transform-origin:564px 564px;animation:pulse 3.6s ease-in-out infinite}
    .flicker{animation:flicker 7s linear infinite}
    @keyframes pulse{0%,100%{opacity:.96}50%{opacity:1}}
    @keyframes flicker{0%,3%,5%,65%,67%,100%{opacity:1}4%,66%{opacity:.77}}
  </style>
</defs>
<rect width="1129" height="1129" fill="#050505"/>
<g class="sign" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-style="italic"><animate attributeName="opacity" values=".78;1;.88;1;.7;1" dur="3.1s" repeatCount="indefinite"/>
  <g fill="none" stroke="#ff1027" stroke-linejoin="round" filter="url(#neon)"><animate attributeName="opacity" values=".5;1;.72;1;.42;1" dur="2.4s" repeatCount="indefinite"/>
    <text class="flicker" x="564" y="383" font-size="139" letter-spacing="5" stroke-width="25">ULTIMATE</text>
    <text x="564" y="566" font-size="171" letter-spacing="2" stroke-width="29">PINBALL</text>
    <text class="flicker" x="564" y="749" font-size="147" letter-spacing="5" stroke-width="25">ARCADE</text>
  </g>

  <g fill="none" stroke="#ff2238" stroke-linejoin="round" filter="url(#soft)">
    <text x="564" y="383" font-size="139" letter-spacing="5" stroke-width="13">ULTIMATE</text>
    <text x="564" y="566" font-size="171" letter-spacing="2" stroke-width="14">PINBALL</text>
    <text x="564" y="749" font-size="147" letter-spacing="5" stroke-width="13">ARCADE</text>
  </g>
  <g fill="#fffdfb" stroke="#fff" stroke-width="3">
    <text x="564" y="383" font-size="139" letter-spacing="5">ULTIMATE</text>
    <text x="564" y="566" font-size="171" letter-spacing="2">PINBALL</text>
    <text x="564" y="749" font-size="147" letter-spacing="5">ARCADE</text>
  </g>
<g mask="url(#letterMask)" opacity=".72"><rect x="-1129" y="0" width="1129" height="1129" fill="url(#sweep)"><animate attributeName="x" values="-1129;1129" dur="3.4s" repeatCount="indefinite"/></rect></g>
</g>
</svg>





