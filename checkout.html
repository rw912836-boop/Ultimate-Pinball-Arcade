<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f1"><link rel="icon" type="image/png" href="ultimate-pinball-icon.png"><title>Your bag and checkout | Ultimate Pinball Arcade</title><meta name="description" content="Review your pinball arcade order and continue to secure cryptocurrency checkout."><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#17191b;font-family:Arial,sans-serif}header{height:76px;background:#fff;border-bottom:1px solid #e4e4e0;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1120px)/2))}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-size:12px;line-height:1.35;font-weight:700;letter-spacing:.1em}.brand img{width:46px;height:46px;object-fit:contain}.back{font-size:14px;font-weight:700}main{width:min(100% - 32px,1040px);margin:52px auto 75px}.eyebrow{margin:0 0 12px;color:#bd4326;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 27px;font-size:clamp(36px,5vw,54px);letter-spacing:-.05em}.checkout-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:24px;align-items:start}.panel{padding:26px;background:#fff;border:1px solid #e2e0da;border-radius:8px}.panel h2{font-size:21px;margin:0 0 20px}.cart-line{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid #eceae5}.cart-line img{width:92px;height:82px;object-fit:contain;background:#f2f2ef}.cart-line h3{font-size:15px;margin:0 0 7px}.price{font-weight:700}.muted{color:#6a6e70;font-size:13px;line-height:1.55}.controls{display:flex;align-items:center;gap:12px;margin-top:10px}.controls button,.remove{border:1px solid #ddd;background:#fff;padding:5px 10px;cursor:pointer}.remove{color:#9c321c}.summary{display:flex;justify-content:space-between;align-items:center;margin:20px 0;font-weight:700}.empty{padding:28px 0;text-align:center;color:#666;line-height:1.7}.btn{width:100%;min-height:48px;border:0;background:#bd4326;color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.fields{display:grid;gap:12px}.fields label{display:grid;gap:6px;font-weight:700;font-size:13px}.fields input,.fields textarea,.fields select{width:100%;padding:12px;border:1px solid #d7d7d3;background:#fff;font:16px Arial,sans-serif}.fields textarea{resize:vertical}.status{font-size:14px;line-height:1.6;color:#315b3a}.status.error{color:#a5311b}.payment{margin-top:22px;padding:19px;background:#f7f6f2;border:1px solid #e6e2d8;overflow-wrap:anywhere}.payment h3{margin:0 0 10px}.wallet{display:block;margin:12px 0;padding:12px;background:#fff;font:13px/1.6 monospace}.warning{margin-top:14px;font-size:12px;line-height:1.6;color:#68521b}.copy{width:100%;padding:11px;border:1px solid #17191b;background:#fff;font-weight:700;cursor:pointer}.small-link{display:inline-block;margin-top:18px;color:#a93620;font-weight:700}footer{text-align:center;padding:26px;color:#696d70;font-size:13px}footer a{color:inherit}@media(max-width:720px){header{height:66px;padding:0 16px}main{margin:35px auto}.checkout-grid{grid-template-columns:1fr}.panel{padding:21px}.cart-line{grid-template-columns:70px 1fr auto;gap:10px}.cart-line img{width:70px;height:70px}.back{font-size:13px}}</style></head>
<body><header><a class="brand" href="index.html"><img src="ultimate-pinball-icon.png" alt=""><span>ULTIMATE<br>PINBALL ARCADE</span></a><a class="back" href="index.html#catalog">Continue shopping</a></header><main><p class="eyebrow">Your order</p><h1>Shopping bag & checkout</h1><div class="checkout-grid"><section class="panel"><h2>Your bag</h2><div id="items"></div><a class="small-link" href="index.html#catalog">? Continue shopping</a></section><section class="panel"><h2>Delivery and payment</h2><div id="summary"></div><form id="order-form" class="fields"><label>Name<input id="customer-name" autocomplete="name" maxlength="120" required></label><label>Email<input id="customer-email" type="email" autocomplete="email" maxlength="254" required></label><label>Phone (optional)<input id="customer-phone" type="tel" autocomplete="tel" maxlength="40"></label><label>Shipping address (optional)<textarea id="shipping-address" rows="3" maxlength="1000"></textarea></label><label>Payment method<select id="payment-asset"><option value="btc">Bitcoin (BTC ? Bitcoin network)</option><option value="eth">Ethereum (ETH ? Ethereum network)</option><option value="usdt">USDT (TRON ? TRC20)</option></select></label><button class="btn" id="order-button" type="submit">Create order and continue</button></form><p class="muted" style="margin:13px 0 0">An order must be created before sending cryptocurrency. Payments are checked manually.</p><p id="status" class="status" role="status" aria-live="polite"></p><div id="payment" class="payment" hidden></div></section></div></main><footer><a href="contact.html">Need help? Contact us</a> ? <a href="privacy-policy.html">Privacy policy</a> ? ? 2026 Ultimate Pinball Arcade</footer>
<script>
const API_BASE='https://admin.ultimatepinballarcade.com';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=value=>'$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let bag=[];try{bag=JSON.parse(localStorage.getItem('upa_cart')||'[]').filter(item=>item&&item.slug&&Number(item.qty)>0)}catch(_error){bag=[]}
let order=null;
function persist(){try{localStorage.setItem('upa_cart',JSON.stringify(bag))}catch(_error){}}
function render(){const target=document.getElementById('items');if(!bag.length){target.innerHTML='<div class="empty">Your bag is empty.<br>Choose a pinball machine or accessory to get started.</div>';document.getElementById('summary').innerHTML='';document.getElementById('order-form').hidden=true;return}document.getElementById('order-form').hidden=false;target.innerHTML=bag.map(item=>`<article class="cart-line"><img src="${esc(item.image||'pinball-neon.svg')}" alt="${esc(item.title||'Pinball product')}" onerror="this.src='pinball-neon.svg'"><div><h3>${esc(item.title)}</h3><span class="price">${fmt(item.price)}</span><div class="controls"><button type="button" aria-label="Decrease quantity" onclick="changeQty('${esc(item.slug)}',-1)">?</button><span>${item.qty}</span><button type="button" aria-label="Increase quantity" onclick="changeQty('${esc(item.slug)}',1)">+</button><button type="button" class="remove" onclick="removeItem('${esc(item.slug)}')">Remove</button></div></div><strong>${fmt(Number(item.price)*item.qty)}</strong></article>`).join('');let total=bag.reduce((sum,item)=>sum+Number(item.price)*item.qty,0);document.getElementById('summary').innerHTML=`<div class="summary"><span>Estimated total (USD)</span><span>${fmt(total)}</span></div>`}
function changeQty(slug,delta){const item=bag.find(row=>row.slug===slug);if(!item)return;item.qty=Math.max(1,item.qty+delta);persist();render()}
function removeItem(slug){bag=bag.filter(item=>item.slug!==slug);persist();render()}
function showError(message){const node=document.getElementById('status');node.className='status error';node.textContent=message}
document.getElementById('order-form').addEventListener('submit',async event=>{event.preventDefault();if(!bag.length)return;const button=document.getElementById('order-button'),status=document.getElementById('status');button.disabled=true;status.className='status';status.textContent='Creating your order?';document.getElementById('payment').hidden=true;const payload={customer_name:document.getElementById('customer-name').value.trim(),customer_email:document.getElementById('customer-email').value.trim(),customer_phone:document.getElementById('customer-phone').value.trim(),shipping_address:document.getElementById('shipping-address').value.trim(),payment_asset:document.getElementById('payment-asset').value,items:bag.map(item=>({slug:item.slug,quantity:item.qty}))};try{const response=await fetch(`${API_BASE}/api/orders/`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});let data={};try{data=await response.json()}catch(_error){}if(!response.ok)throw new Error(data.error||'Order service is unavailable. Please try again or contact the store.');order={reference:data.reference,token:data.order_token};status.textContent=`Order ${data.reference} created. Total: ${fmt(data.amount_usd)}. ${data.instructions||''}`;const payment=document.getElementById('payment');payment.hidden=false;payment.innerHTML=`<h3>Send payment on ${esc(data.payment.network)}</h3><p class="muted">Send the current crypto equivalent of <strong>${fmt(data.amount_usd)} USD</strong>.</p><code class="wallet" id="wallet-address">${esc(data.payment.address)}</code><button type="button" class="copy" onclick="copyWallet()">Copy receiving address</button><form id="tx-form" class="fields" style="margin-top:18px"><label>Transaction ID / hash<input id="tx-hash" required maxlength="160" placeholder="Paste transaction hash"></label><button class="btn" type="submit">Submit transaction for review</button></form><p class="warning">Check the network carefully. Payment is verified manually; submitting a hash does not mark the order as paid.</p>`;document.getElementById('tx-form').addEventListener('submit',submitHash)}catch(error){showError(error.message)}finally{button.disabled=false}});
async function copyWallet(){const address=document.getElementById('wallet-address').textContent;try{await navigator.clipboard.writeText(address);document.getElementById('status').textContent='Wallet address copied.'}catch(_error){document.getElementById('status').textContent='Copy the wallet address above.'}}
async function submitHash(event){event.preventDefault();if(!order)return;const status=document.getElementById('status'),hash=document.getElementById('tx-hash').value.trim();status.className='status';status.textContent='Submitting transaction for review?';try{const response=await fetch(`${API_BASE}/api/orders/${encodeURIComponent(order.reference)}/payment/`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':`Bearer ${order.token}`},body:JSON.stringify({transaction_hash:hash})});let data={};try{data=await response.json()}catch(_error){}if(!response.ok)throw new Error(data.error||'Could not submit transaction. Please contact the store with your order reference.');status.textContent=`Transaction submitted for manual review for order ${order.reference}.`}catch(error){showError(error.message)}}
render();
</script></body></html>
